name: Node Test CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]  # 新增这行

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Test
        run: npm test
