name: Guard Ready Label
on:
  issues:
    types: [labeled]

jobs:
  guard:
    if: github.event.label.name == 'ready' && github.actor != 'zwmhua2-lab2'
    runs-on: ubuntu-latest
    permissions:
      issues: write  # 确保有写权限
    steps:
      - name: Remove unauthorized ready label
        run: |
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --remove-label "ready"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
